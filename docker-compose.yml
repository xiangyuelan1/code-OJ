services:
  oj:
    build: .
    container_name: oj-system
    restart: always
    ports:
      - "5000:5000"
    volumes:
      # 只挂载数据库文件，不挂载整个 prisma 目录
      # 否则 volume 中的旧 schema.prisma 会覆盖镜像中的新版本
      - oj-db:/app/data
      - oj-uploads:/app/uploads
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=oj-prod-secret-key-2026-change-me
      - JWT_EXPIRES_IN=24h
      - NODE_ENV=production
      - PORT=5000

volumes:
  oj-db:
  oj-uploads:
