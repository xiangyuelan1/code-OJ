# 私有部署版配置（阉割版）
# 去掉商业化模块（付费/推广/身份区分），所有用户全权限，AI需自备Key
# 可与全量版在同一服务器共存（端口5001，独立数据卷）
#
# 使用方式: docker compose -f docker-compose.deploy.yml up -d
services:
  oj:
    build:
      context: .
      args:
        - EDITION=deploy
    container_name: oj-deploy
    restart: always
    ports:
      - "5001:5000"
    volumes:
      - oj-deploy-db:/app/data
      - oj-deploy-uploads:/app/uploads
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=${JWT_SECRET:-deploy-secret-change-me}
      - JWT_EXPIRES_IN=24h
      - NODE_ENV=production
      - PORT=5000
      - EDITION=deploy
      # AI 配置（必填，否则AI功能不可用）
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}

volumes:
  oj-deploy-db:
  oj-deploy-uploads:
